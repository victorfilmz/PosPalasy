<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="100%" height="100%">
  <defs>
    <linearGradient id="fullBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="fullPaperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="fullGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284C7" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Group: Icon Mark -->
  <g transform="translate(6, 6)">
    <!-- Base Squircle -->
    <rect x="0" y="0" width="48" height="48" rx="13" fill="url(#fullBgGrad)" filter="url(#fullGlow)"/>
    <rect x="1" y="1" width="46" height="46" rx="12" fill="none" stroke="#60A5FA" stroke-width="1" stroke-opacity="0.5"/>

    <!-- P Stem -->
    <rect x="10" y="11" width="7" height="26" rx="3.5" fill="#FFFFFF"/>

    <!-- P Loop -->
    <path d="M15 11 H28 C33.523 11 38 15.477 38 21 C38 26.523 33.523 31 28 31 H15 Z" fill="#FFFFFF"/>

    <!-- P Loop Inner -->
    <path d="M17 16 H27 C29.761 16 32 18.239 32 21 C32 23.761 29.761 26 27 26 H17 Z" fill="#0F172A"/>

    <!-- Receipt inside loop -->
    <path d="M19 18 H29 V24 H19 Z" fill="url(#fullPaperGrad)"/>
    <rect x="21" y="20" width="5" height="1" rx="0.5" fill="#0284C7"/>
    <rect x="21" y="22" width="3" height="1" rx="0.5" fill="#64748B"/>

    <!-- High Tech Cyan Dot -->
    <circle cx="34" cy="14" r="2" fill="#06B6D4"/>
    <!-- Dominican Red Accent Dot -->
    <circle cx="13.5" cy="33.5" r="1.6" fill="#EF4444"/>
  </g>

  <!-- Typography: PosPalasy -->
  <text x="64" y="31" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="22" letter-spacing="-0.5" fill="#FFFFFF">Pos<tspan fill="#38BDF8">Palasy</tspan></text>

  <!-- Subtitle Badge: DGII e-CF Facturación -->
  <g transform="translate(64, 37)">
    <rect x="0" y="0" width="124" height="16" rx="4" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
    <circle cx="8" cy="8" r="3" fill="#10B981"/>
    <text x="16" y="11.5" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="700" font-size="8.5" fill="#94A3B8" letter-spacing="0.3">DGII e-CF • POS FISCAL</text>
  </g>
</svg>
