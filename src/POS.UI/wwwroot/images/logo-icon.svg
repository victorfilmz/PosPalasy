<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0284C7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#bgGrad)" filter="url(#glow)"/>

  <!-- Subtle Inner Border -->
  <rect x="5" y="5" width="54" height="54" rx="15" fill="none" stroke="#60A5FA" stroke-width="1.2" stroke-opacity="0.5"/>

  <!-- Stylized "P" Stem / POS Terminal Body -->
  <rect x="15" y="16" width="9" height="32" rx="4.5" fill="#FFFFFF"/>

  <!-- Loop of the "P" / Screen Arc -->
  <path d="M22 16 H36 C42.627 16 48 21.373 48 28 C48 34.627 42.627 40 36 40 H22 Z" fill="#FFFFFF"/>

  <!-- Cutout in Loop forming screen aperture -->
  <path d="M24 23 H35 C37.761 23 40 25.239 40 28 C40 30.761 37.761 33 35 33 H24 Z" fill="#0F172A"/>

  <!-- Digital Receipt Slip coming out of screen -->
  <path d="M27 25 H37 V31 H27 Z" fill="url(#paperGrad)"/>
  <rect x="29" y="27" width="6" height="1" rx="0.5" fill="#0284C7"/>
  <rect x="29" y="29" width="4" height="1" rx="0.5" fill="#64748B"/>

  <!-- Cyan High-Tech Speed Lines -->
  <circle cx="43" cy="20" r="2.5" fill="#06B6D4"/>
  
  <!-- Dominican Crimson Sovereign Pulse Dot -->
  <circle cx="19.5" cy="43.5" r="2" fill="#EF4444"/>
</svg>
